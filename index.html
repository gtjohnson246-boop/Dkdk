<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Android Errors</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Roboto', Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Main Menu */
    #menu {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
    }

    #menu h1 {
      font-size: 26px;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .menu-btn {
      background-color: #1f1f1f;
      color: #ffffff;
      border: 1px solid #3a3a3a;
      padding: 14px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .menu-btn:hover {
      background-color: #333333;
    }

    /* Error Screens */
    .error-screen {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #000000;
      width: 100vw;
      height: 100vh;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .back-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      background-color: rgba(30, 30, 30, 0.85);
      color: #cccccc;
      border: 1px solid #444444;
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 20;
    }

    .back-btn:hover {
      background-color: #333333;
      color: #ffffff;
    }

    /* Screen 1: Error 303 (No Command) */
    .no-command-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .no-command-text {
      font-size: 20px;
      color: #e0e0e0;
      letter-spacing: 0.5px;
    }

    /* Screen 2: Samsung Kernel Warranty Bit */
    .warranty-text {
      position: absolute;
      top: 52px;
      left: 16px;
      color: #ffd700;
      font-family: monospace;
      font-size: 15px;
      font-weight: bold;
    }

    .samsung-boot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      position: relative;
    }

    .samsung-logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .galaxy-model {
      font-size: 22px;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .galaxy-badge {
      border: 1.5px solid #ffffff;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 16px;
    }

    .powered-by {
      position: absolute;
      bottom: 32px;
      font-size: 14px;
      color: #cccccc;
      letter-spacing: 0.5px;
    }

    .powered-by span {
      font-weight: bold;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Main Menu -->
  <div id="menu">
    <h1>Test Android Errors</h1>
    <button class="menu-btn" onclick="showError('error-303')">Error 303 (No Command)</button>
    <button class="menu-btn" onclick="showError('samsung-warranty')">Samsung Kernel Warranty Bit</button>
    <button class="menu-btn" onclick="showError('linux-penguin')">Linux Penguin Error (Tux)</button>
  </div>

  <!-- Screen 1: Error 303 (No Command) -->
  <div id="error-303" class="error-screen">
    <button class="back-btn" onclick="backToMenu()">← Back to Menu</button>
    <div class="no-command-container">
      <!-- Dead Android Robot SVG -->
      <svg width="110" height="120" viewBox="0 0 110 120" xmlns="http://w3.org">
        <!-- Antennas -->
        <line x1="36" y1="24" x2="26" y2="10" stroke="#4285F4" stroke-width="3" stroke-linecap="round"/>
        <line x1="74" y1="24" x2="84" y2="10" stroke="#4285F4" stroke-width="3" stroke-linecap="round"/>
        <!-- Head -->
        <path d="M 27 42 A 28 26 0 0 1 83 42 Z" fill="#4285F4"/>
        <!-- Eyes -->
        <circle cx="42" cy="30" r="2.8" fill="#000000"/>
        <circle cx="68" cy="30" r="2.8" fill="#000000"/>
        <!-- Torso (Open Chest) -->
        <rect x="27" y="46" width="56" height="44" rx="5" fill="#4285F4"/>
        <!-- Open Hatch Door -->
        <polygon points="36,54 74,54 70,82 40,82" fill="#000000"/>
        <!-- Red Exclamation Triangle -->
        <polygon points="55,58 43,78 67,78" fill="#EA4335"/>
        <rect x="53.7" y="64" width="2.6" height="7" fill="#000000"/>
        <circle cx="55" cy="74.5" r="1.5" fill="#000000"/>
        <!-- Arms -->
        <rect x="13" y="46" width="10" height="32" rx="5" fill="#4285F4"/>
        <rect x="87" y="46" width="10" height="32" rx="5" fill="#4285F4"/>
        <!-- Legs -->
        <rect x="38" y="90" width="10" height="22" rx="5" fill="#4285F4"/>
        <rect x="62" y="90" width="10" height="22" rx="5" fill="#4285F4"/>
      </svg>
      <div class="no-command-text">No command</div>
    </div>
  </div>

  <!-- Screen 2: Samsung Kernel Warranty Bit -->
  <div id="samsung-warranty" class="error-screen">
    <button class="back-btn" onclick="backToMenu()">← Back to Menu</button>
    <div class="warranty-text">Set Warranty Bit : kernel</div>
    <div class="samsung-boot-container">
      <div class="samsung-logo">SAMSUNG</div>
      <div class="galaxy-model">Galaxy J5 <span class="galaxy-badge">6</span></div>
      <div class="powered-by">powered by <span>android</span></div>
    </div>
  </div>

  <!-- Screen 3: Linux Penguin Error (Tux) -->
  <div id="linux-penguin" class="error-screen">
    <button class="back-btn" onclick="backToMenu()">← Back to Menu</button>
    <!-- Centered Tux Penguin SVG -->
    <svg width="72" height="84" viewBox="0 0 100 115" xmlns="http://w3.org">
      <!-- Body -->
      <path d="M 50 10 C 33 10 27 25 27 42 C 27 55 18 70 18 85 C 18 98 32 103 50 103 C 68 103 82 98 82 85 C 82 70 73 55 73 42 C 73 25 67 10 50 10 Z" fill="#181818" stroke="#333333" stroke-width="1.5"/>
      <!-- Flippers -->
      <path d="M 27 45 C 15 55 10 68 14 73 C 17 76 23 68 27 60 Z" fill="#181818" stroke="#333333" stroke-width="1"/>
      <path d="M 73 45 C 85 55 90 68 86 73 C 83 76 77 68 73 60 Z" fill="#181818" stroke="#333333" stroke-width="1"/>
      <!-- White Belly -->
      <ellipse cx="50" cy="70" rx="22" ry="28" fill="#ffffff"/>
      <!-- Eyes -->
      <ellipse cx="43" cy="24" rx="4.5" ry="6" fill="#ffffff"/>
      <ellipse cx="57" cy="24" rx="4.5" ry="6" fill="#ffffff"/>
      <circle cx="44" cy="24" r="2" fill="#000000"/>
      <circle cx="56" cy="24" r="2" fill="#000000"/>
      <!-- Beak -->
      <path d="M 38 31 Q 50 26 62 31 Q 65 36 50 40 Q 35 36 38 31 Z" fill="#ffb800"/>
      <path d="M 40 34 Q 50 38 60 34" fill="none" stroke="#c88a00" stroke-width="1.5"/>
      <!-- Left Foot -->
      <path d="M 36 92 C 25 90 14 95 16 102 C 18 108 32 108 42 103 C 45 101 43 94 36 92 Z" fill="#ffb800" stroke="#c88a00" stroke-width="1"/>
      <!-- Right Foot -->
      <path d="M 64 92 C 75 90 86 95 84 102 C 82 108 68 108 58 103 C 55 101 57 94 64 92 Z" fill="#ffb800" stroke="#c88a00" stroke-width="1"/>
    </svg>
  </div>

  <script>
    function showError(screenId) {
      document.getElementById('menu').style.display = 'none';
      const screens = document.querySelectorAll('.error-screen');
      screens.forEach(screen => screen.style.display = 'none');
      document.getElementById(screenId).style.display = 'flex';
    }

    function backToMenu() {
      const screens = document.querySelectorAll('.error-screen');
      screens.forEach(screen => screen.style.display = 'none');
      document.getElementById('menu').style.display = 'flex';
    }
  </script>

</body>
</html>
