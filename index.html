<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Android Errors</title>
  <style>
    body {
      margin: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Menu Screen */
    #menu-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 500;
      margin: 0 0 12px 0;
      letter-spacing: 0.5px;
    }
    .menu-btn {
      width: 300px;
      background-color: #212121;
      color: #ffffff;
      border: 1px solid #424242;
      padding: 14px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .menu-btn:hover {
      background-color: #333333;
      border-color: #616161;
    }

    /* Shared Error Screen Wrapper */
    .error-screen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #616161;
      border: 1px solid #333333;
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 10;
    }
    .back-btn:hover {
      color: #ffffff;
      border-color: #757575;
    }

    /* Screen 1: No Command */
    #error-303 svg {
      width: 340px;
      max-width: 85vw;
      height: auto;
      margin-bottom: 12px;
    }
    .status-text {
      font-size: 38px;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: #f5f5f5;
    }

    /* Screen 2: Samsung Galaxy J56 Kernel Warranty Bit */
    #error-samsung {
      justify-content: space-between;
      padding: 12px 16px 40px 16px;
      box-sizing: border-box;
    }
    .kernel-warning {
      align-self: flex-start;
      color: #d4c84a;
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .samsung-center {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .samsung-brand {
      font-family: 'Arial Black', 'Impact', sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3.5px;
      color: #ffffff;
      margin-bottom: 4px;
      padding-left: 4px;
    }
    .galaxy-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .galaxy-model {
      font-size: 72px;
      font-weight: 600;
      letter-spacing: -1px;
      color: #ffffff;
      line-height: 1;
    }
    .galaxy-six {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 34px;
      height: 34px;
      border: 5px solid #ffffff;
      border-radius: 50%;
      font-size: 23px;
      font-weight: 700;
      color: #ffffff;
      box-sizing: border-box;
    }
    .powered-by {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .powered-text {
      font-size: 16px;
      color: #e0e0e0;
      margin-bottom: -4px;
      padding-left: 2px;
    }
    .android-wordmark {
      font-size: 52px;
      font-weight: 300;
      letter-spacing: -1.5px;
      color: #ffffff;
      line-height: 1;
    }
  </style>
</head>
<body>

  <!-- Menu Screen -->
  <div id="menu-screen">
    <h1>Test Android Errors</h1>
    <button class="menu-btn" onclick="showScreen('error-303')">Error 303 (No Command)</button>
    <button class="menu-btn" onclick="showScreen('error-samsung')">Samsung Kernel Warranty Bit</button>
  </div>

  <!-- Error 1: No Command -->
  <div id="error-303" class="error-screen">
    <button class="back-btn" onclick="returnToMenu()">← Back to Menu</button>

    <svg viewBox="0 0 360 270" xmlns="http://w3.org">
      <defs>
        <linearGradient id="androidBody" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c5e165"/>
          <stop offset="50%" stop-color="#a4c639"/>
          <stop offset="100%" stop-color="#68821d"/>
        </linearGradient>
        <linearGradient id="androidLimb" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#c5e165"/>
          <stop offset="60%" stop-color="#98b832"/>
          <stop offset="100%" stop-color="#5a7018"/>
        </linearGradient>
        <linearGradient id="hatchLid" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#78828a"/>
          <stop offset="100%" stop-color="#373d42"/>
        </linearGradient>
        <linearGradient id="chestBay" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#546e7a"/>
          <stop offset="100%" stop-color="#90a4ae"/>
        </linearGradient>
        <linearGradient id="redAlert" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff4444"/>
          <stop offset="100%" stop-color="#b71c1c"/>
        </linearGradient>
        <linearGradient id="yellowAlert" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffe066"/>
          <stop offset="55%" stop-color="#ffca28"/>
          <stop offset="100%" stop-color="#f59f00"/>
        </linearGradient>
        <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ff1744" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <circle cx="175" cy="95" r="55" fill="url(#redGlow)"/>

      <g transform="translate(15, 10)">
        <rect x="75" y="142" width="44" height="22" rx="11" fill="url(#androidLimb)" transform="rotate(-32 75 142)"/>
        <path d="M 98 112 L 175 68 C 185 62, 196 66, 202 76 L 228 122 C 234 132, 230 144, 220 150 L 143 194 C 133 200, 121 196, 115 186 L 89 140 C 83 130, 88 118, 98 112 Z" fill="url(#androidBody)"/>
        <rect x="92" y="162" width="46" height="23" rx="11.5" fill="url(#androidLimb)" transform="rotate(-32 92 162)"/>
        <polygon points="118,118 172,87 195,126 141,157" fill="url(#chestBay)" stroke="#263238" stroke-width="2"/>
        <line x1="136" y1="108" x2="159" y2="147" stroke="#37474f" stroke-width="1.5"/>
        <line x1="154" y1="97" x2="177" y2="136" stroke="#37474f" stroke-width="1.5"/>
        <line x1="126" y1="131" x2="180" y2="100" stroke="#37474f" stroke-width="1.5"/>
        <line x1="134" y1="144" x2="188" y2="113" stroke="#37474f" stroke-width="1.5"/>
        <polygon points="118,118 172,87 156,36 102,67" fill="url(#hatchLid)" stroke="#8c969e" stroke-width="1.5"/>
        <line x1="182" y1="64" x2="233" y2="152" stroke="#33400e" stroke-width="3"/>
        <path d="M 185 63 C 218 46, 255 68, 259 104 C 261 124, 251 142, 235 151 Z" fill="url(#androidBody)"/>
        <ellipse cx="222" cy="82" rx="3.5" ry="4.5" fill="#ffffff" transform="rotate(-30 222 82)"/>
        <line x1="252" y1="92" x2="270" y2="85" stroke="#a4c639" stroke-width="4.5" stroke-linecap="round"/>
        <rect x="172" y="168" width="56" height="22" rx="11" fill="url(#androidLimb)" transform="rotate(-32 172 168)"/>

        <g transform="translate(133, 62)">
          <path d="M 27 4 L 4 44 C 2 47, 4 50, 8 50 L 46 50 C 50 50, 52 47, 50 44 L 27 4 Z" fill="url(#redAlert)" stroke="#ff6666" stroke-width="1"/>
          <rect x="25" y="18" width="4" height="16" rx="1.5" fill="#1a0000"/>
          <circle cx="27" cy="40" r="2.5" fill="#1a0000"/>
        </g>
      </g>

      <g transform="translate(205, 108)">
        <path d="M 60 6 L 6 102 C 3 108, 7 114, 14 114 L 106 114 C 113 114, 117 108, 114 102 L 60 6 Z" fill="url(#yellowAlert)"/>
        <rect x="55.5" y="36" width="9" height="42" rx="3" fill="#000000"/>
        <circle cx="60" cy="93" r="5.5" fill="#000000"/>
      </g>
    </svg>

    <div class="status-text">No command</div>
  </div>

  <!-- Error 2: Samsung Galaxy J56 Kernel Warning -->
  <div id="error-samsung" class="error-screen">
    <button class="back-btn" onclick="returnToMenu()">← Back to Menu</button>

    <div class="kernel-warning">Set Warranty Bit : kernel</div>

    <div class="samsung-center">
      <div class="samsung-brand">SAMSUNG</div>
      <div class="galaxy-row">
        <span class="galaxy-model">Galaxy J5</span>
        <span class="galaxy-six">6</span>
      </div>
    </div>

    <div class="powered-by">
      <span class="powered-text">powered by</span>
      <span class="android-wordmark">android</span>
    </div>
  </div>

  <script>
    const menuScreen = document.getElementById("menu-screen");
    const errorScreens = document.querySelectorAll(".error-screen");

    function showScreen(screenId) {
      menuScreen.style.display = "none";
      errorScreens.forEach(screen => screen.style.display = "none");
      document.getElementById(screenId).style.display = "flex";
    }

    function returnToMenu() {
      errorScreens.forEach(screen => screen.style.display = "none");
      menuScreen.style.display = "flex";
    }
  </script>

</body>
</html>
